name: Deploy to Vercel
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Database, env vars, deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -x
          echo "=== 0. Install dependencies (pins Prisma to project version) ==="
          npm install --no-audit --no-fund
          echo "=== 1. Push database schema to Neon ==="
          npx prisma db push
          echo "=== 2. Seed database (skips if already seeded) ==="
          node prisma/seed.mjs
          echo "=== 2b. Rename store in database if old name ==="
          node -e "const {PrismaClient}=require('@prisma/client');(async()=>{const p=new PrismaClient();const s=await p.setting.findUnique({where:{key:'storeName'}});if(s&&s.value==='ShopDeck'){await p.setting.update({where:{key:'storeName'},data:{value:'Unic'}});console.log('storeName: ShopDeck -> Unic')}else{console.log('storeName already:',s&&s.value)}await p.\$disconnect()})()" || true
          echo "=== 2c. Purge old-brand settings and admin email ==="
          node prisma/migrate-brand.mjs || true
          echo "=== 3. Ensure Vercel project exists ==="
          curl -s -X POST "https://api.vercel.com/v9/projects" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d '{"name":"unic","framework":"nextjs"}' | head -c 600
          echo
          echo "=== 4. Set env vars on Vercel ==="
          ENV_JSON=$(jq -n --arg db "$DATABASE_URL" --arg ss "$SESSION_SECRET" --arg gu "$GMAIL_USER" --arg gp "$GMAIL_APP_PASSWORD" '[{"key":"DATABASE_URL","value":$db,"type":"encrypted","target":["production"]},{"key":"SESSION_SECRET","value":$ss,"type":"encrypted","target":["production"]}] + (if ($gu != "" and $gp != "") then [{"key":"GMAIL_USER","value":$gu,"type":"encrypted","target":["production"]},{"key":"GMAIL_APP_PASSWORD","value":$gp,"type":"encrypted","target":["production"]}] else [] end)')
          curl -s -X POST "https://api.vercel.com/v10/projects/unic/env?upsert=true" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$ENV_JSON" | head -c 600
          echo
          echo "=== 5. Link project ==="
          npx --yes vercel@latest link --yes --project unic --token "$VERCEL_TOKEN"
          echo "=== 6. Deploy ==="
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "=== 7. Remove legacy shopdeck Vercel project (old URL) ==="
          curl -s -X DELETE "https://api.vercel.com/v9/projects/shopdeck" -H "Authorization: Bearer $VERCEL_TOKEN" | head -c 200
          echo
