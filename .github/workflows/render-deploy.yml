name: Create Render Service
on: workflow_dispatch
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create service on Render
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
        run: |
          H="Authorization: Bearer $RENDER_KEY"
          OWNER_ID=$(curl -s -H "$H" https://api.render.com/v1/owners | jq -r '.[0].owner.id // .[0].id')
          echo "OWNER_ID=$OWNER_ID"
          SSECRET=$(openssl rand -hex 32)
          mk() {
            jq -n --arg oid "$OWNER_ID" --arg s "$SSECRET" --arg plan "$1" '
              def esd(p): {env:"node", buildCommand:"npm install && npm run build", startCommand:"npx prisma db push && node prisma/seed.mjs && npm start", envVars:[{key:"SESSION_SECRET",value:$s},{key:"DATABASE_URL",value:"file:./dev.db"},{key:"NODE_VERSION",value:"20"}]} + (if p == "" then {} else {plan:p} end);
              {type:"web_service", ownerId:$oid, repo:"https://github.com/nnm24ee057Koustubh/shopdeck", serviceDetails:{runtime:"node", name:"shopdeck", branch:"main", autoDeploy:"yes", region:"singapore", envSpecificDetails:esd($plan)}}'
          }
          mk "free" > /tmp/b1.json
          mk "" > /tmp/b2.json
          echo "=== ATTEMPT 1 (envSpecificDetails + plan free) ==="
          R=$(curl -s -w "\nHTTPCODE:%{http_code}" -X POST -H "$H" -H "Content-Type: application/json" -d @/tmp/b1.json https://api.render.com/v1/services)
          echo "$R"
          CODE=$(echo "$R" | tail -1 | sed 's/HTTPCODE://')
          if [ "$CODE" != "201" ]; then
            echo "=== ATTEMPT 2 (no plan) ==="
            R=$(curl -s -w "\nHTTPCODE:%{http_code}" -X POST -H "$H" -H "Content-Type: application/json" -d @/tmp/b2.json https://api.render.com/v1/services)
            echo "$R"
            CODE=$(echo "$R" | tail -1 | sed 's/HTTPCODE://')
          fi
          if [ "$CODE" != "201" ]; then
            echo "=== CHECK IF SERVICE ALREADY EXISTS ==="
            EX=$(curl -s -H "$H" "https://api.render.com/v1/services?ownerId=$OWNER_ID")
            echo "$EX" | jq '[.[] | {id, name, status}]'
            SID=$(echo "$EX" | jq -r '.[] | select(.name=="shopdeck") | .id' | head -1)
            if [ -z "$SID" ]; then echo "CREATION_FAILED"; exit 1; fi
            echo "USING EXISTING SERVICE $SID"
          else
            BODY=$(echo "$R" | head -n -1)
            SID=$(echo "$BODY" | jq -r '.id')
            echo "SERVICE_ID=$SID"
          fi
          echo "=== POLLING BUILD (up to 10 min) ==="
          for i in $(seq 1 60); do
            sleep 10
            S=$(curl -s -H "$H" "https://api.render.com/v1/services/$SID" | jq -r '.status // empty')
            echo "poll $i: status=$S"
            if [ "$S" = "live" ] || [ "$S" = "deployed" ] || [ "$S" = "build_failed" ] || [ "$S" = "update_failed" ]; then break; fi
          done
          echo "=== FINAL SERVICE STATE ==="
          curl -s -H "$H" "https://api.render.com/v1/services/$SID" | jq '{id, name, status, hostname, suspended}'
